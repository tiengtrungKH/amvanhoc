<style>
/* Layout: sticky chapter rail (left) + one chapter at a time; each chapter = theory → drill → exercises */
:root{

@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){

  --accent:#74c3a9; --accent-soft:#1f322b; --seal:#e0796c;

:root[data-theme="dark"]{
  --bg:#111715; --paper:#18201d; --ink:#e3e9e5; --muted:#9aaaa2; --line:#2c3833;

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.65}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:14px;margin-bottom:22px}
.top h1{font-family:var(--f-display);font-weight:900;font-size:clamp(28px,4.4vw,44px);line-height:1.1;margin:0;letter-spacing:.02em;text-wrap:balance}

.block{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:22px clamp(16px,3vw,28px);margin-bottom:20px}

.block>h3::after{content:"";flex:1;height:1px;background:var(--line)}
.theory h4{font-size:16.5px;margin:20px 0 6px;font-weight:700}

.zh{font-family:var(--f-display);font-weight:700}

.tag{display:inline-block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-right:6px;vertical-align:2px}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:6px;margin-top:8px}

.opts button.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:600}

.ok-f{background:var(--ok-bg)!important;border-color:var(--ok)!important;color:var(--ok)!important}
.bad-f{background:var(--bad-bg)!important;border-color:var(--bad)!important;color:var(--bad)!important}
.shown-f{background:var(--shown-bg)!important;border-color:var(--shown)!important;color:var(--shown)!important}
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}

.btn.ghost{background:transparent;color:var(--accent)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.result{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums}

.exer:first-of-type{border-top:0;padding-top:0;margin-top:0}

.exer h4 span{color:var(--accent);font-variant-numeric:tabular-nums;margin-right:4px}
.exer .d{color:var(--muted);margin:0 0 10px;font-size:14.5px}

.sol p{margin:4px 0}
.grid-items{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));gap:8px 18px}
.grid-items>div{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.cue{font-family:var(--f-display);font-weight:700;font-size:17px;min-width:3.2em}
.svgbox{overflow-x:auto;max-width:100%}
.svgbox svg{display:block;max-width:100%;height:auto}
.vc-line{stroke:var(--muted);fill:none;stroke-width:1.2}
.vc-grid{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}
.vc-dot{fill:var(--ink)}
.vc-lab{fill:var(--ink);font-family:var(--f-ipa);font-size:17px}
.vc-lab.pth{fill:var(--accent);font-weight:700}
.vc-axis{fill:var(--muted);font-family:var(--f-body);font-size:12px}
.vc-num{fill:var(--paper);font-family:var(--f-body);font-size:11px;font-weight:700}
.vc-numbg{fill:var(--accent)}
.corner{display:inline-grid;grid-template-columns:auto auto auto;grid-template-rows:auto auto auto;align-items:center;justify-items:center;gap:0 2px;margin:4px 14px 4px 0;vertical-align:middle}
.corner .c{font-size:11px;color:var(--accent)}
.corner .m{font-family:var(--f-display);font-size:24px;font-weight:700;grid-column:2;grid-row:2}
.pager{display:flex;justify-content:space-between;gap:10px;margin-top:6px;flex-wrap:wrap}
.pager a{color:var(--accent);text-decoration:none;font-weight:600;font-size:14px}
@media (max-width:860px){
  .layout{grid-template-columns:minmax(0,1fr)}
  nav.rail{flex-direction:row;overflow-x:auto;gap:6px;padding-block:8px;background:var(--bg);z-index:5;top:env(safe-area-inset-top,0px);border-bottom:1px solid var(--line);margin-inline:-4px}
  nav.rail a{grid-template-columns:auto auto;flex:none;border-left:0;border-bottom:3px solid transparent;padding:6px 10px}
  nav.rail a[aria-current="true"]{border-bottom-color:var(--accent)}
  nav.rail .t span,nav.rail .sc{display:none}
  .part-head .no{font-size:42px}
}
@media (prefers-reduced-motion:no-preference){ .part{animation:fade .25s ease} @keyframes fade{from{opacity:.4}to{opacity:1}} }
details.theory>summary{cursor:pointer;font-size:12.5px;letter-spacing:.14em;color:var(--accent);font-weight:700;list-style:none;display:flex;gap:8px;align-items:center}
details.theory>summary::-webkit-details-marker{display:none}
details.theory>summary::before{content:"▸";transition:transform .15s}
details.theory[open]>summary::before{transform:rotate(90deg)}
details.theory[open]>summary{margin-bottom:14px}
.total{font-weight:700;color:var(--accent);margin:8px 0 0!important;font-variant-numeric:tabular-nums;font-size:15px!important}
.zm36{min-width:560px}.zm36 td{font-family:var(--f-display);font-size:16px;padding:9px 10px}
.zm36 th.diag{position:relative;min-width:110px;height:58px;background:linear-gradient(to top right,var(--accent-soft) calc(50% - 1px),var(--line) 50%,var(--accent-soft) calc(50% + 1px))}
.zm36 .d-tr{position:absolute;right:8px;top:4px;text-align:left;line-height:1.2}.zm36 .d-bl{position:absolute;left:8px;bottom:4px;text-align:left;line-height:1.2}
figure.yt{margin:6px 0 12px;overflow-x:auto}figure.yt img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;background:#fff}
figure.yt figcaption{font-size:13px;color:var(--muted);margin-top:4px}
ol.yq{padding-left:22px;margin:0;display:flex;flex-direction:column;gap:8px}
.key.sum{border-left:4px solid var(--accent)}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1><small>音韵学 · 知识总结与在线练习</small>十二个专题总复习</h1><p class="total" id="total"></p>

    <div style="display:flex;gap:14px;align-items:center">

<script>
/* ---------- Vowel chart ---------- */
const VX0=70,VX1=380,VY0=40,VY1=280;
function fx(y){return VX0+(y-VY0)*(100/240)}
function cx(y){return (fx(y)+VX1)/2}
const LV={hi:40,mh:120,mid:160,ml:200,nl:240,lo:280};
const VOW=[
 ['i','hi','f','l',1],['y','hi','f','r',1],['ɨ','hi','c','l',0],['ʉ','hi','c','r',0],['ɯ','hi','b','l',0],['u','hi','b','r',1],
 ['e','mh','f','l',0],['ø','mh','f','r',0],['ɤ','mh','b','l',1],['o','mh','b','r',1],
 ['ə','mid','c','m',0],
 ['ɛ','ml','f','l',1],['œ','ml','f','r',0],['ʌ','ml','b','l',0],['ɔ','ml','b','r',0],
 ['æ','nl','f','l',0],['ɐ','nl','c','m',0],
 ['a','lo','f','l',0],['A','lo','c','m',1],['ɑ','lo','b','l',0],['ɒ','lo','b','r',0]
];
function vowelChart(numbered){
  let s=`<svg viewBox="0 0 440 310" width="440" role="img" aria-label="元音舌位图">`;
  s+=`<polygon class="vc-line" points="${VX0},${VY0} ${VX1},${VY0} ${VX1},${VY1} ${fx(VY1)},${VY1}"/>`;
  s+=`<line class="vc-line" x1="${cx(VY0)}" y1="${VY0}" x2="${cx(VY1)}" y2="${VY1}"/>`;
  [LV.mh,LV.ml].forEach(y=>{s+=`<line class="vc-grid" x1="${fx(y)}" y1="${y}" x2="${VX1}" y2="${y}"/>`});
  s+=`<text class="vc-axis" x="${VX0}" y="22" text-anchor="middle">前</text><text class="vc-axis" x="${cx(VY0)}" y="22" text-anchor="middle">央</text><text class="vc-axis" x="${VX1}" y="22" text-anchor="middle">后</text>`;
  [['高',LV.hi],['半高',LV.mh],['中',LV.mid],['半低',LV.ml],['低',LV.lo]].forEach(([t,y])=>{s+=`<text class="vc-axis" x="6" y="${y+4}">${t}</text>`});
  let k=0;
  VOW.forEach(([sym,lv,pos,side,pth])=>{
    const y=LV[lv]; const x=pos==='f'?fx(y):pos==='c'?cx(y):VX1;
    s+=`<circle class="vc-dot" cx="${x}" cy="${y}" r="3"/>`;
    const lx= side==='l'?x-9: side==='r'?x+9 : x+8; const anchor= side==='l'?'end':'start';
    const ly= side==='m'? y-7 : y+6;
    if(numbered){
      if(!numbered.includes(sym)) return;
      const n=numbered.indexOf(sym)+1; const cxx= side==='l'?x-16: x+16; const cyy= side==='m'? y-12 : y;
      s+=`<circle class="vc-numbg" cx="${cxx}" cy="${cyy}" r="9"/><text class="vc-num" x="${cxx}" y="${cyy+4}" text-anchor="middle">${n}</text>`;
    } else {
      s+=`<text class="vc-lab${pth?' pth':''}" x="${lx}" y="${ly}" text-anchor="${anchor}">${sym}</text>`;
    }
  });
  s+=`<text class="vc-axis" x="${VX1+30}" y="${VY1+24}" text-anchor="end">点左：不圆唇 · 点右：圆唇</text>`;
  return s+`</svg>`;
}
const VOPTS='—|i|y|ɨ|ʉ|ɯ|u|e|ø|ɤ|o|ə|ɛ|œ|ʌ|ɔ|æ|ɐ|a|A|ɑ|ɒ';
const NUMV=['i','y','u','ɯ','e','o','ɤ','ɛ','ɔ','a','ɑ','ə'];

/* ---------- helpers for tables ---------- */
function T(head,rows,cls){
  return `<div class="tbl"><table class="${cls||''}"><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>`<td${i===0?' class="l"':''}>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
const I=s=>`<span class="ipa">[${s}]</span>`;

/* ---------- CONTENT ---------- */
const FQ=(list)=>`<div class="grid-items">${list.map(r=>`<div><span class="cue">${r[0]}</span>→ [[${r[1]}]]</div>`).join('')}</div>`;
const BASE=[
/* 1 */
{zh:'元音舌位图',vi:'韵母（元音）的舌位图',short:'元音舌位图',
theory:`
<h4>元音按哪些标准分类？</h4>
<ul>
<li><b>舌头的形状：</b><span class="zh">舌面元音</span>、<span class="zh">舌尖元音</span>（如 zi、zhi 中的 -i）、<span class="zh">卷舌元音</span>（如 er）。</li>
<li><b>舌位的高低</b>（= 开口度）：<span class="zh">高 – 次高 – 半高 – 中 – 半低 – 次低 – 低</span>。舌位越高，开口越小；舌位越低，开口越大。</li>
<li><b>舌位的前后：</b><span class="zh">前 – 央 – 后</span>。</li>
<li><b>嘴唇的圆展：</b><span class="zh">圆唇</span> / <span class="zh">不圆唇</span>。</li>
<li>此外还有：<b>发音的时间</b> <span class="zh">长元音 / 短元音</span>（越南语 ai – ay，a – ă，ơ – â）；<b>气流是否经过鼻腔</b> <span class="zh">口元音 / 鼻化元音</span>。</li>
</ul>
<div class="key">舌面元音的描写公式：<b>前/央/后 + 高/半高/半低/低 + 圆唇/不圆唇</b>。例如 ${I('i')} = 舌面、前、高、不圆唇；${I('u')} = 舌面、后、高、圆唇。</div>
<h4>元音舌位图</h4>
<p>梯形上的每个点代表一个舌位。点左边的符号是不圆唇元音，右边是圆唇元音。带颜色的是普通话的单元音。</p>
<div class="svgbox">${vowelChart()}</div>
<p>八个标准元音：${I('i')} ${I('e')} ${I('ɛ')} ${I('a')} ${I('ɑ')} ${I('ɔ')} ${I('o')} ${I('u')}。</p>
<h4>普通话的 10 个单元音韵母</h4>
${T(['字母','国际音标','描写','例字'],[
['a',I('A'),'舌面、央、低、不圆唇','啊 ā'],
['o',I('o'),'舌面、后、半高、圆唇','喔 ō'],
['e',I('ɤ'),'舌面、后、半高、不圆唇','鹅 é'],
['ê',I('ɛ'),'舌面、前、半低、不圆唇','欸 ê'],
['i',I('i'),'舌面、前、高、不圆唇','衣 yī'],
['u',I('u'),'舌面、后、高、圆唇','乌 wū'],
['ü',I('y'),'舌面、前、高、圆唇','迂 yū'],
['-i（前）',I('ɿ'),'舌尖前、高、不圆唇','资 zī、词 cí、思 sī'],
['-i（后）',I('ʅ'),'舌尖后、高、不圆唇','知 zhī、吃 chī、日 rì'],
['er',I('ɚ'),'卷舌、央、中','儿 ér']
])}
<h4>越南语对照</h4>
<p>i/y ${I('i')}、ê ${I('e')}、e ${I('ɛ')}：前、不圆唇；ư ${I('ɯ')}、ơ ${I('ɤ')}：后、不圆唇；u ${I('u')}、ô ${I('o')}、o ${I('ɔ')}：后、圆唇；a ${I('a')}：低元音。</p>`,

{zh:'声母的分类',vi:'塞音、擦音、送气/不送气、清/浊',short:'声母分类',
theory:`
<h4>辅音的不同取决于两个方面</h4>
<ul><li><b>发音部位：</b>发音时形成阻碍的部位。下面的主动部位：下唇、舌头；上面的被动部位：上唇、上齿、齿龈、硬腭、软腭。</li>
<li><b>发音方法：</b>发音时阻碍气流和解除阻碍的方法，从三方面分析：（1）阻碍的方式，（2）声带是否振动，（3）气流的强弱。</li></ul>
<h4>普通话的七个发音部位</h4>
${T(['部位','发音器官','声母'],[
['<span class="zh">双唇音</span>','下唇 + 上唇','b p m'],
['<span class="zh">唇齿音</span>','下唇 + 上齿','f'],
['<span class="zh">舌尖前音</span>','舌尖 + 上齿背','z c s'],
['<span class="zh">舌尖中音</span>','舌尖 + 上齿龈','d t n l'],
['<span class="zh">舌尖后音</span>','舌尖（翘起）+ 硬腭前部','zh ch sh r'],
['<span class="zh">舌面前音</span>','舌面前部 + 硬腭','j q x'],
['<span class="zh">舌面后音（舌根音）</span>','舌面后部 + 软腭','g k h']])}
<h4>阻碍的方式</h4>
<ul>
<li><span class="zh">塞音</span>（爆破音）：上下发音部位形成闭塞，气流骤然冲破阻碍，爆发成声 → b p d t g k。</li>
<li><span class="zh">擦音</span>：上下发音部位靠近，形成窄缝，气流从窄缝中挤出，摩擦成声 → f s sh x h r。</li>
<li><span class="zh">塞擦音</span>：先形成闭塞，然后气流把阻塞部位冲开一条窄缝，摩擦成声 → z c zh ch j q。</li>
<li><span class="zh">鼻音</span>：口腔某部位完全闭塞，软腭和小舌下降，气流从鼻腔流出 → m n（ng）。</li>
<li><span class="zh">边音</span>：舌尖与上齿龈接触，舌头两边留有空隙，气流从舌头两边通过 → l。</li>
</ul>
<h4>清与浊；送气与不送气</h4>
<ul><li><b>清音</b>：声带不振动。<b>浊音</b>：声带振动。普通话的<b>浊音声母只有四个：m、n、l、r</b>，其余都是清音。</li>
<li><b>送气 / 不送气</b>只在<b>塞音</b>和<b>塞擦音</b>中区分：b–p、d–t、g–k、z–c、zh–ch、j–q。擦音、鼻音、边音不区分气流强弱。</li></ul>
<div class="key">描写公式：<b>发音部位 +（送气/不送气）+ 清/浊 + 阻碍方式</b>。例如：b ${I('p')} = 双唇、不送气、清、塞音；r ${I('ʐ')} = 舌尖后、浊、擦音。</div>
<h4>普通话声母总表（22 个 = 21 个辅音声母 + 零声母）</h4>
<div class="tbl"><table><thead><tr><th rowspan="2" class="l">部位</th><th colspan="2">塞音（清）</th><th colspan="2">塞擦音（清）</th><th colspan="2">擦音</th><th>鼻音</th><th>边音</th></tr><tr><th>不送气</th><th>送气</th><th>不送气</th><th>送气</th><th>清</th><th>浊</th><th>浊</th><th>浊</th></tr></thead><tbody>
<tr><td class="l">双唇</td><td>b ${I('p')}</td><td>p ${I('pʰ')}</td><td></td><td></td><td></td><td></td><td>m ${I('m')}</td><td></td></tr>
<tr><td class="l">唇齿</td><td></td><td></td><td></td><td></td><td>f ${I('f')}</td><td></td><td></td><td></td></tr>
<tr><td class="l">舌尖前</td><td></td><td></td><td>z ${I('ts')}</td><td>c ${I('tsʰ')}</td><td>s ${I('s')}</td><td></td><td></td><td></td></tr>
<tr><td class="l">舌尖中</td><td>d ${I('t')}</td><td>t ${I('tʰ')}</td><td></td><td></td><td></td><td></td><td>n ${I('n')}</td><td>l ${I('l')}</td></tr>
<tr><td class="l">舌尖后</td><td></td><td></td><td>zh ${I('tʂ')}</td><td>ch ${I('tʂʰ')}</td><td>sh ${I('ʂ')}</td><td>r ${I('ʐ')}</td><td></td><td></td></tr>
<tr><td class="l">舌面前</td><td></td><td></td><td>j ${I('tɕ')}</td><td>q ${I('tɕʰ')}</td><td>x ${I('ɕ')}</td><td></td><td></td><td></td></tr>
<tr><td class="l">舌面后</td><td>g ${I('k')}</td><td>k ${I('kʰ')}</td><td></td><td></td><td>h ${I('x')}</td><td></td><td></td><td></td></tr>
</tbody></table></div>
<p>按课件分组：6 个塞音（b/p、d/t、g/k）· 5 个清擦音（f、sh、s、x、h）· 6 个塞擦音（z/c、zh/ch、j/q）· 4 个浊声母（m、n、l、r）· 零声母。</p>
<p><b>零声母</b>：开头没有辅音声母的字音（安 ān、友 yǒu）。实际发音时元音前往往有轻微的喉塞成分或同部位的轻微摩擦。</p>`,

{zh:'反切',vi:'用两个汉字给一个汉字注音',short:'反切',
theory:`
<h4>定义</h4>
<p><b>反切</b>是用<b>两个汉字</b>注出另一个汉字读音的注音方法：<b>反切上字取声母</b>，<b>反切下字取韵母和声调</b>，两者结合拼读成一个音。这也是中国古代对汉字字音结构的分析。</p>
<div class="key">例：<span class="zh">同，徒红切</span> → 徒 ${I('tʰu')} 取 ${I('tʰ')} + 红 ${I('xuŋ')} 取 ${I('uŋ')} 和阳平 → 同 ${I('tʰuŋ³⁵')} tóng。</div>
<h4>反切各部分的名称</h4>
${T(['部分','名称','例：同，徒红切'],[
['被注音的字','被切字','同'],['上一字','反切上字 / 切上字 / 上字','徒'],['下一字','反切下字 / 切下字 / 下字','红'],['两字合称','切语','徒红']])}
<h4>历史</h4>
<ul><li>反切以前的注音法：<b>打比方</b>、<b>读若</b>（冶，读若也）、<b>直音</b>（用容易认识的同音字：蛊，音古）。</li>
<li>反切约在<b>东汉后期</b>（公元二世纪末三世纪初）产生，是在<b>梵文</b>拼音方法的启发和影响下创造的（佛教传入中国）。</li>
<li>早期不用"切"字，叫"某某<b>反</b>"或"某某<b>翻</b>"；<b>唐代宗大历</b>（766–779）以后，因忌讳"反"字，改为"某某<b>切</b>"。"反"和"切"意义相同，都是"反覆切摩"之意（清·李汝珍）。</li></ul>
<h4>反切的优点</h4>
<ul><li>避免了用生僻字给常用字注音（直音法的缺点）。</li><li>可以给所有汉字注音。</li></ul>
<h4>反切的局限性</h4>
<ul><li><b>部分反切不能切出现代音</b>（语音演变）：圮，房美切，今读 pǐ 而非 fěi；东，德红切，今读 dōng（阴平），而红是阳平；公，古红切 gōng；鸡，古奚切 jī。</li>
<li><b>反切上下字含有多余成分</b>：上字多韵母，下字多声母（徒多 u，红多 x）。</li>
<li><b>切语用字纷繁</b>：声母 t 用 7 个字（都丁多当得德冬），声母 p 用二十多个字。</li></ul>
<h4>用今音拼读反切的窍门</h4>
<ul><li><b>平分阴阳</b>：下字是平声时，<b>上字清 → 阴平</b>，<b>上字浊 → 阳平</b>。德（清）+ 红 → 东 dōng；徒（浊）+ 红 → 同 tóng。</li>
<li><b>浊上变去</b>：上字全浊 + 下字上声 → 今读去声。常（禅母）+ 演（上声）→ 善 shàn。</li>
<li><b>入派四声</b>：下字是入声字（六、谷……）时，按上字的清浊判断今调：全浊 → 阳平（房六 伏 fú），次浊 → 去声（莫六 目 mù）。</li>
<li><b>腭化（k- → tɕ-）</b>：古 + 奚 → ki → jī（鸡）；古 + 双 → 江 jiāng。</li></ul>`,
quiz:[
{f:`"同，徒红切"中：同是[[被切字]]，徒是[[反切上字|切上字|上字]]，红是[[反切下字|切下字|下字]]。`},
{f:`反切上字取被切字的[[声母]]；反切下字取被切字的[[韵母]]和[[声调]]。`},
{f:`反切早期叫"某某[[反|翻]]"；唐代宗大历以后改为"某某[[切]]"。`},
{f:`反切约在[[东汉]]后期产生，受[[梵文|梵]]拼音方法的影响。`},
{f:`反切以前，用同音字注音（蛊，音古）的方法叫[[直音|直音法]]。`},
{q:`"土，他鲁切"读：`,o:['tǔ','lǔ','tā','dǔ'],a:0,e:'他取 t-，鲁取 -u 和上声 → tǔ。'},
{q:`反切与直音相比的优点是：`,o:['像国际音标一样精确','不必用生僻字，能给所有汉字注音','没有多余成分','只用一个字'],a:1},
{q:`东，德红切，今读 dōng 而不读 dóng，因为：`,o:['《广韵》记错了','平声分阴阳：上字"德"是清声母，所以被切字读阴平','"红"本来是阴平','"德"是入声字'],a:1},
{q:`下列哪一项<b>不是</b>反切的局限性？`,o:['有多余成分','切语用字纷繁','不能给生僻字注音','部分反切切不出现代音'],a:2,e:'反切恰恰可以给所有汉字注音。'},

{zh:'宋人三十六字母',vi:'五音、七音、清浊',short:'三十六字母',
theory:`
<h4>声、纽、字母、声类</h4>
<ul><li><b>声 / 纽 / 声纽</b>：声母的名称。"纽"是枢纽的意思，古人认为声母在一个字音里是关键（其实有的字音没有声母）。</li>
<li><b>字母</b>：声母的代表字，如三十六字母。</li>
<li><b>声类</b>：一般指反切上字的分类（系联的结果），与声母的含义不完全一致。</li></ul>
<h4>从守温三十字母到三十六字母</h4>
<p>唐代末年，守温参照梵文的"体文"为汉语创制了三十字母（敦煌发现《守温韵学残卷》）。三十六字母与三十字母相比：</p>
<ul><li>舌音多一个<b>娘</b>母；正齿添一个<b>床（牀）</b>母；</li>
<li>唇音增加<b>非 敷 奉 微</b>四个——最突出的是<b>唇音一分为二</b>：唐代的"不芳并明"相当于重唇"帮滂并明"，多出的"非敷奉微"是从重唇音里分化出来的轻唇音。</li></ul>
<p>三十六字母大体上反映了唐宋之间汉语的声母系统。</p>
<h4>三十六字母表</h4>
<div class="tbl"><table><thead><tr><th colspan="2">五音 / 七音</th><th>全清</th><th>次清</th><th>全濁</th><th>次濁</th><th>清</th><th>濁</th><th>今称</th></tr></thead><tbody>
<tr><td colspan="2">牙音</td><td>見 ${I('k')}</td><td>溪 ${I('kʰ')}</td><td>群 ${I('g')}</td><td>疑 ${I('ŋ')}</td><td></td><td></td><td>舌面后</td></tr>
<tr><td rowspan="2">舌音</td><td>舌頭</td><td>端 ${I('t')}</td><td>透 ${I('tʰ')}</td><td>定 ${I('d')}</td><td>泥 ${I('n')}</td><td></td><td></td><td>舌尖中</td></tr>
<tr><td>舌上</td><td>知 ${I('ȶ')}</td><td>徹 ${I('ȶʰ')}</td><td>澄 ${I('ȡ')}</td><td>娘 ${I('ȵ')}</td><td></td><td></td><td>舌面前</td></tr>
<tr><td rowspan="2">脣音</td><td>重脣</td><td>幫 ${I('p')}</td><td>滂 ${I('pʰ')}</td><td>並 ${I('b')}</td><td>明 ${I('m')}</td><td></td><td></td><td>双唇</td></tr>
<tr><td>輕脣</td><td>非 ${I('pf')}</td><td>敷 ${I('pfʰ')}</td><td>奉 ${I('bv')}</td><td>微 ${I('ɱ')}</td><td></td><td></td><td>唇齿</td></tr>
<tr><td rowspan="2">齒音</td><td>齒頭</td><td>精 ${I('ts')}</td><td>清 ${I('tsʰ')}</td><td>從 ${I('dz')}</td><td></td><td>心 ${I('s')}</td><td>邪 ${I('z')}</td><td>舌尖前</td></tr>
<tr><td>正齒</td><td>照 ${I('tɕ')}</td><td>穿 ${I('tɕʰ')}</td><td>牀 ${I('dʑ')}</td><td></td><td>審 ${I('ɕ')}</td><td>禪 ${I('ʑ')}</td><td>舌面前</td></tr>
<tr><td colspan="2">喉音</td><td>影 ${I('ʔ')}</td><td></td><td></td><td>喻 ${I('j')}</td><td>曉 ${I('x')}</td><td>匣 ${I('ɣ')}</td><td>喉 / 舌面后</td></tr>
<tr><td colspan="2">半舌音</td><td></td><td></td><td></td><td>來 ${I('l')}</td><td></td><td></td><td>舌尖中</td></tr>
<tr><td colspan="2">半齒音</td><td></td><td></td><td></td><td>日 ${I('ȵʑ')}</td><td></td><td></td><td>舌面前</td></tr>
</tbody></table></div>
<p>注意：字母"並"不可写为"并"。称呼：幫母或幫紐。</p>
<p>分组记忆：四字组——幫組、非組、端組、知組、見組、影組（影曉匣喻）；五字组——精組、照組；另有來、日。</p>
<h4>五音、七音、九音</h4>
<ul><li><b>五音</b>：唇、舌、牙、齿、喉（名义上是发音部位，实际上含有发音方法的内容）。</li>
<li><b>七音</b>：五音 + <b>半舌</b>（來）+ <b>半齿</b>（日）。</li>
<li><b>九音</b>：再把舌音分为舌头、舌上，齿音分为齿头、正齿，唇音分为重唇、轻唇。</li>
<li>实质：重唇 → 塞音 p（明除外）；轻唇 → 塞擦音 pf；舌音 → 塞音 t、ȶ；齿音 → 塞擦音、擦音 ts、tɕ。</li></ul>
<h4>清浊（四类）</h4>
${T(['类别','现代语音学解释','例'],[
['<b>全清</b>','不送气、不带音的塞音、塞擦音和擦音','幫 端 知 精 照 見 影 · 心 審 曉'],
['<b>次清</b>','送气的塞音和塞擦音','滂 敷 透 徹 清 穿 溪'],
['<b>全濁</b>','带音的塞音、塞擦音和擦音','並 奉 定 澄 從 牀 群 · 邪 禪 匣'],
['<b>次濁</b>','带音的鼻音、边音和半元音','明 微 泥 娘 疑 喻 來 日']])}
<p>清浊涉及三个方面，古人往往混为一谈：一是声带颤动不颤动；二是送气不送气（"初发声"指不送气，"送气声"指送气）；三是声调的阴阳（阴调为清，阳调为浊）。</p>`,

{f:`重唇相当于今天的[[双唇|雙脣|双唇音]]音；轻唇相当于[[唇齿|脣齒|唇齿音]]音。`},
{f:`舌头音：端、透、[[定]]、[[泥]]；舌上音：知、[[彻|徹]]、澄、[[娘]]。`},
{f:`牙音：見、[[溪]]、[[群]]、疑；喉音：影、[[晓|曉]]、[[匣]]、喻。`},
{f:`半舌音是[[来|來]]；半齿音是[[日]]。`},
{f:`七音 = 五音（唇、舌、牙、齿、喉）+ [[半舌|半舌音]] + [[半齿|半齒|半齿音|半齒音]]。`},
{f:`次清是[[送气|送氣]]的塞音和塞擦音；次浊包括鼻音、边音和[[半元音]]。`},

{zh:'十六韵摄',vi:'《广韵》的十六摄',short:'十六韵摄',
theory:`
<h4>相关概念</h4>
<ul><li><b>韵</b>：只要求<i>韵腹、韵尾</i>相同，且<i>声调相同</i>（不管韵头）。<b>韵母</b>：还要区别韵头，但不区别声调。</li>
<li><b>韵类</b>：韵书中反切下字的分类，既区别韵头，也区别声调。</li>
<li><b>韵部</b>：只要韵腹和韵尾相同，不区别声调，也不区别韵头。</li>
<li><b>韵目</b>：韵书里韵的标目，即韵的代表字（如唐、荡、宕）。</li></ul>
<h4>什么是韵摄？</h4>
<div class="key">韵摄是按照音近原则归并韵得出的大类。归并的原则是：<b>不计声调、不计韵头、韵腹相近、韵尾相同（或相近）</b>。《广韵》206 韵归为 <b>16 摄</b>（见《四声等子》《切韵指南》）。</div>
<p>例：<b>效摄</b>——豪 ${I('ɑu')}、肴 ${I('au')}、宵 ${I('iɛu')}、萧 ${I('ieu')}（平声），以及相配的皓 巧 小 篠（上声）、号 效 笑 啸（去声），都是 -u 韵尾。<br>
<b>宕摄</b>——唐 ${I('ɑŋ')} / ${I('uɑŋ')}、阳 ${I('iaŋ')} / ${I('iuaŋ')}，以及入声铎 ${I('ɑk')}、药 ${I('iak')}：韵尾 -ŋ / -k。</p>
<h4>十六摄的次序</h4>
<p class="key" style="font-size:18px"><span class="zh">通 江 止 遇 蟹 臻 山 · 效 果 假 宕 梗 曾 流 深 咸</span></p>
${T(['摄','韵尾','主要的韵（举平以赅上去；括号内为入声）','内/外转'],[
['<span class="zh">1 通</span>','-ŋ / -k','東 冬 鍾（屋 沃 燭）','内'],
['<span class="zh">2 江</span>','-ŋ / -k','江（覺）','外'],
['<span class="zh">3 止</span>','阴声','支 脂 之 微','内'],
['<span class="zh">4 遇</span>','阴声（零）','魚 虞 模','内'],
['<span class="zh">5 蟹</span>','-i','齊 佳 皆 灰 咍（另有去声 祭 泰 夬 廢）','外'],
['<span class="zh">6 臻</span>','-n / -t','真 諄 臻 文 欣 魂 痕（質 術 櫛 物 迄 沒）','外'],
['<span class="zh">7 山</span>','-n / -t','元 寒 桓 刪 山 先 仙（月 曷 末 黠 鎋 屑 薛）','外'],
['<span class="zh">8 效</span>','-u','蕭 宵 肴 豪','外'],
['<span class="zh">9 果</span>','零','歌 戈','内'],
['<span class="zh">10 假</span>','零','麻','外'],
['<span class="zh">11 宕</span>','-ŋ / -k','陽 唐（藥 鐸）','内'],
['<span class="zh">12 梗</span>','-ŋ / -k','庚 耕 清 青（陌 麥 昔 錫）','外'],
['<span class="zh">13 曾</span>','-ŋ / -k','蒸 登（職 德）','内'],
['<span class="zh">14 流</span>','-u','尤 侯 幽','内'],
['<span class="zh">15 深</span>','-m / -p','侵（緝）','内'],
['<span class="zh">16 咸</span>','-m / -p','覃 談 鹽 添 咸 銜 嚴 凡（合 盍 葉 帖 洽 狎 業 乏）','外']])}
<ul><li>阳声（鼻音韵尾）：<b>-m</b> 深 咸 · <b>-n</b> 臻 山 · <b>-ŋ</b> 通 江 宕 梗 曾。这些摄都有相配的入声 -p、-t、-k。</li>
<li>阴声（元音韵尾或零韵尾）：止 遇 蟹 效 果 假 流，没有入声。</li></ul>
<h4>内转和外转</h4>
<p>"转"是辗转的意思，指声母和韵母辗转相拼。一般情况是，凡<b>有真正二等韵</b>的摄叫<b>外转</b>，没有二等韵的摄叫<b>内转</b>。比如假摄只有一个麻韵，但麻韵包括二、三等，所以也属外转；江摄只有一个二等江韵，也属外转。</p>
<p>内八转：通 止 遇 果 宕 曾 流 深 · 外八转：江 蟹 臻 山 效 假 梗 咸（臻摄依传统归外转）。</p>`,

],

{zh:'声调：平、上、去、入',vi:'现代汉语声调与中古四声',short:'声调',
theory:`
<h4>现代汉语的声调</h4>
<ul><li><b>声调</b>是具有区别意义作用的音高，主要由音高的变化构成，是<b>相对音高</b>。</li>
<li><b>调值</b>：声调的实际音值和读法，即音节高低升降曲直长短的变化形式。<b>调类</b>：把调值相同的字归纳在一起所建立的类。</li>
<li><b>赵元任</b>的<b>五度标记法</b>：5 高 · 4 半高 · 3 中 · 2 半低 · 1 低。</li></ul>
${T(['调类','调值','调型','调号','例字'],[['阴平','55','平','ˉ','妈 mā'],['阳平','35','升','ˊ','麻 má'],['上声','214','曲','ˇ','马 mǎ'],['去声','51','降','ˋ','骂 mà']])}
<p><b>标调口诀：</b>"a 母出现莫放过，没有 a 母找 e、o，iu、ui 两韵标在后，i 上标调把点抹，轻声音节不标调。"</p>
<p><b>汉越音对照</b>（大致倾向）：第一声 ~ 横声；第二声 ~ 玄声或横声；第三声 ~ 问声或跌声；第四声 ~ 锐声或重声。</p>
<h4>中古的四声</h4>
<ul><li>"四声"的名称起于<b>南北朝齐梁时代</b>（公元五世纪末至六世纪初）。在此之前，汉族人自己并没有察觉到四声的区别。</li>
<li>调类：4 个 · 调名：<b>平、上、去、入</b> · 调型：平、升、降、促 · 调值：不清楚（拟测 33、35、41、3）。</li>
<li>同是四声，内容与现代的阴平、阳平、上声、去声不一样。</li></ul>
<h4>舒促与声调</h4>
${T(['韵母','韵尾','声调'],[['阴声韵','-ø -i -u','平 / 上 / 去（舒声调）'],['阳声韵','-m -n -ŋ','平 / 上 / 去（舒声调）'],['入声韵（促声韵）','-p -t -k','只有入声（促声调）']])}
<p>因此，<b>入声韵总是具有入声调</b>，不可能有平、上、去声调；阴声韵、阳声韵具有平、上、去声调，但不可能有入声调。</p>
<h4>平仄</h4>
<p><b>平</b> = 平声；<b>仄</b>（本义"倾侧"，即"不平"）= 上、去、入。古人让平仄在诗句中交替出现，以求抑扬之美："無邊落木蕭蕭下（平平仄仄平平仄），不盡長江滾滾來（仄仄平平仄仄平）"。今天用普通话难以再调平仄，因为入声已经消失（例：薛，中古入声 → 仄，今北京读阴平）。</p>
<h4>四角标圈法</h4>
<p><span class="corner"><span class="c">上</span><span></span><span class="c">去</span><span></span><span class="m">字</span><span></span><span class="c">平</span><span></span><span class="c">入</span></span>
平——左下角 · 上——左上角 · 去——右上角 · 入——右下角；阴调、阳调用不同的圈区分。用来标示<b>调类</b>：中古调值不清楚，只知道调类；现代方言调值相同而调类不一定相同（214：北京话是上声，重庆话是去声，开封话是阴平）；分析古今声调演变也需要标示调类。</p>`,
quiz:[
{f:`声调主要由[[音高]]的变化构成（相对音高）。`},
{f:`五度标记法是[[赵元任|趙元任]]提出的。`},
{f:`普通话调值：阴平 [[55]]，阳平 [[35]]，上声 [[214]]，去声 [[51]]。`},
{f:`中古四声：平、[[上]]、[[去]]、[[入]]。`},
{f:`平、上、去是[[舒声|舒聲|舒声调|舒聲調]]；入是[[促声|促聲|促声调|促聲調]]。`},

/* 7 */
{zh:'洪音 · 细音',vi:'兼论开合与四等',short:'洪音与细音',
theory:`
<h4>开合</h4>
<ul><li>开合区分韵母<b>唇形的圆展</b>。韵头（或韵腹）有 <b>u</b> 则圆，即为<b>合口</b>（uan、iuan）；无 u 则展，即为<b>开口</b>（an、ian）。</li>
<li>中古 i 和 u 可以同时作韵头（iuan）。中古没有"齐齿呼"的说法：ian 是开口呼，iuan 是合口呼。</li>
<li>韵尾中 u 的有无与开合无关（au 是开口）。</li>
<li>开合同韵（唐韵有 ɑŋ 和 uɑŋ）与独韵（幽韵只有开口；虞韵只有合口）。</li></ul>
<h4>韵等（四等）</h4>
${T(['韵等','韵头或韵腹开口度','有无 i-','守温"四等轻重例"（开口）'],[['一等','最大','无','高 '+I('kɑu')],['二等','次大','无','交 '+I('kau')],['三等','次小','有 i-','嬌 '+I('kiɐu')],['四等','最小','有 i-','澆 '+I('kieu')]])}
<p>韵头或韵腹中如果有 i，一定是三等或四等；但韵尾中 i 的有无与韵等无关。</p>
<h4>洪音与细音</h4>
<div class="key"><b>洪音</b> = 一等、二等（韵头或韵腹没有 i）· <b>细音</b> = 三等、四等（有 i）。洪细实际上区分了<b>韵头或韵腹中 i 的有无</b>；韵尾中 i 的有无与洪细无关（ai、uai 仍是洪音）。</div>
<p>近现代的"四呼"也可以用洪细划分：<b>开口呼、合口呼 = 洪音</b>；<b>齐齿呼（i-）、撮口呼（y-）= 细音</b>。在汉语语音演变过程中，洪细起的作用比韵等大。</p>
<h4>中古两呼四等向近现代四呼的演变</h4>
${T(['中古','洪细','近现代四呼'],[['开口 一、二等','洪','开口呼'],['开口 三、四等（i）','细','齐齿呼（i）'],['合口 一、二等（u）','洪','合口呼（u）'],['合口 三、四等（iu）','细','撮口呼（y）']])}
<p>明朝末年北方话：<b>iu- → y-</b>（y- 产生之后才有"撮口呼"和"四呼"的术语）；<b>ki- → tɕi-</b>：嬌 kiɐu → jiāo，勬 kiuɐn → juān。</p>
<h4>韵等与声母的关系（宋代）</h4>
<ul><li><b>非组</b>（非敷奉微）以及<b>群、邪、禅、喻、日</b>只出现在<b>三等</b>。</li>
<li><b>端组</b>只出现在一、四等 → 今读洪音的是一等，今读细音的是四等。<b>知组、照组</b>出现在二、三等。</li>
<li><b>匣母</b>不出现在三等。</li></ul>
<p>课件例：奋 发（非组 → 三等）；仍 然（日母 → 三等）；恬 tián（端组，细音 → 四等），淡 dàn（端组，洪音 → 一等）。</p>`,
quiz:[
{f:`一等、二等是[[洪音|洪]]；三等、四等是[[细音|細音|细|細]]。`},
{f:`洪细实际上区分韵头或韵腹中 [[i]] 的有无。`},
{f:`开合区分韵头或韵腹中 [[u]] 的有无。`},
{f:`四呼中：开口呼和[[合口|合口呼]]是洪音；[[齐齿|齊齒|齐齿呼|齊齒呼]]和撮口呼是细音。`},
{f:`[[韵尾|韻尾]]中 i 的有无与洪细无关。`},
{f:`中古只有[[开口|開口]]、[[合口]]两呼。`},
{f:`iu- 变为 [[y|ü|y-]] 之后（明末），才产生撮口呼。`},
{q:`韵母 ai 属于：`,o:['洪音','细音','无法判断','两者都是'],a:0,e:'韵尾的 i 不算。'},
{q:`韵母 iuɐn 是：`,o:['洪音，开口','细音，开口','洪音，合口','细音，合口'],a:3},
{q:`开口度最小的是：`,o:['一等','二等','三等','四等'],a:3},
{q:`"发"（非母）属于：`,o:['一等','二等','三等','四等'],a:2,e:'非组只出现在三等。'},
{q:`"天" tiān（透母，今读细音）属于：`,o:['一等','二等','三等','四等'],a:3,e:'端组只出现在一、四等；今读细音 → 四等。'},
{q:`"嬌"（开口三等 kiɐu）今读 jiāo，属于：`,o:['开口呼','齐齿呼','合口呼','撮口呼'],a:1}
],

{zh:'平分阴阳 · 浊上变去 · 入派四声',vi:'从《广韵》到普通话的声调演变',short:'声调演变',
theory:`
<div class="key">调类分化的主要原因是<b>声母的清浊</b>。全浊和次浊可以影响声调的演变；全清（不送气）和次清（送气）在大多数汉语方言中不影响声调的变化，只在个别方言中会导致调类分化。</div>
<h4>一、平分阴阳</h4>
${T(['中古','声母','普通话','例字'],[['平声','清（全清、次清）','<b>阴平</b>','幫 方 當 張 相 香 央 · 滂 芳 湯 倉 昌 康'],['平声','浊（全浊、次浊）','<b>阳平</b>','旁 房 堂 腸 藏 常 強 航 · 忙 囊 郎 瓤 昂 羊']])}
<p>大约在唐代就开始了，宋代文献也有反映；明确把平声分为阴阳两个调类，是从元代周德清的《<b>中原音韵</b>》开始的。</p>
<h4>二、浊上变去</h4>
${T(['中古','声母','普通话','例字'],[['上声','清、次浊','<b>上声</b>','好 古 寶 草 · 馬 老 五 有 女'],['上声','全浊','<b>去声</b>','動 是 父 坐 近 杜 道 後 舅 善']])}
<p>注意：只有<b>全浊</b>上声变去声；<b>次浊</b>上声仍读上声。</p>
<h4>三、入派四声</h4>
${T(['中古','声母','普通话','例字'],[['入声','全浊','<b>阳平</b>','白 讀 轍 舌 絶 轄 掘 習 · 十 學 局'],['入声','次浊','<b>去声</b>','納 辣 滅 熱 孽 越 悦 · 木 月 日 六'],['入声','清','<b>四声都有</b>（无规律）','阴平：八 黑 出 · 阳平：國 德 急 · 上声：筆 北 法 匹 尺 塔 骨 乙 · 去声：必 客 各']])}
<h4>今调类的来历</h4>
${T(['普通话','中古来源','要点'],[['阴平','平声清 + 入声清（部分）','今阴平字只有古<b>清</b>声母'],['阳平','平声全浊、次浊 + 入声全浊 + 入声清（部分）','以古<b>浊</b>声母为主'],['上声','上声清、次浊 + 入声清（部分）','<b>没有</b>古<b>全浊</b>声母'],['去声','去声（清、浊）+ 上声全浊 + 入声次浊 + 入声清（部分）','清浊俱全，数量很多']])}
<p>入声清声母字派入四声。</p>`,
quiz:[
{f:`平声：清声母 → [[阴平|陰平]]；浊声母（全浊、次浊）→ [[阳平|陽平]]。`},
{f:`上声：清、次浊 → [[上声|上聲|上]]；全浊 → [[去声|去聲|去]]。`},
{f:`入声：全浊 → [[阳平|陽平]]；次浊 → [[去声|去聲|去]]；清 → 派入[[四声|四聲]]。`},
{f:`调类分化的主要原因是声母的[[清浊|清濁]]。`},
{f:`明确把平声分为阴阳两类的是元代[[周德清]]的《[[中原音韵|中原音韻]]》。`},
{f:`今阴平字只有古[[清]]声母。`},
{q:`今读上声的字不可能来自古代的：`,o:['全清','次清','次浊','全浊'],a:3},

{q:`"馬"（明母上声）今读：`,o:['上声','去声','阳平','阴平'],a:0,e:'明母是次浊；次浊上仍读上声。'},
{q:`今去声的来源是：`,o:['只有中古去声','去声 + 全浊上 + 次浊入 + 部分清入','去声 + 次浊上','浊平 + 去声'],a:1}
],

/* 9 */
{zh:'反切系联法',vi:'陈澧《切韵考》的系联条例',short:'系联法',
theory:`
<h4>目的</h4>
<p>韵书只用反切注音，并不直接标出声母、韵母。清代<b>陈澧</b>在《<b>切韵考</b>》中用<b>系联法</b>：把反切上字系联成<b>声类</b>（求声母），把反切下字系联成<b>韵类</b>（求韵母）。陈澧系联得 40 声类。</p>
<h4>基本条例</h4>
${T(['条例','含义','上字例','下字例'],[
['<b>同用</b>','两个切语用同一个上字（下字）','冬，都宗切 · 當，都郎切 → 冬、當同用"都"','東，德紅切 · 公，古紅切 → 同用"紅"'],
['<b>互用</b>','两个字互为上字（下字）','當，都郎切 · 都，當孤切','公，古紅切 · 紅，戶公切'],
['<b>递用</b>','A 用 B，B 又用 C → A、B、C 同类','冬，都宗切 · 都，當孤切 → 冬—都—當','東，德紅切 · 紅，戶公切 → 東—紅—公']])}
<h4>分析条例</h4>
<p>同一韵中<b>同音字不分两个切语</b>。因此两个切语的下字同类，则上字必不同类；上字同类，则下字必不同类。</p>
<h4>补充条例</h4>
<p>有些字本属同类，但因切语用字不连贯，用基本条例系联不起来。例如 {都 當 冬 丁} 和 {多 得 德} 各成一组。这时可以利用<b>又音</b>或<b>四声相承</b>：《广韵》東韵"涷，德紅切，<b>又都貢切</b>"；送韵"涷，<b>多貢切</b>"→ 都貢 = 多貢 → "都""多"同属一类（端母）。</p>
<h4>做题步骤</h4>
<ol><li>列出被切字和切语。</li><li>先找互用的一对（往往是一组的"核心"）。</li><li>把同用、递用的字接到核心上。</li><li>检查系联不上的组：是真的不同类（用分析条例），还是需要补充条例。</li></ol>
<p>课件结果：東韵分两个韵类——{紅 公 東 空}（一等 ${I('uŋ')}）和 {戎 融 弓 中 宮 終}（三等 ${I('iuŋ')}）。</p>`,

{zh:'元音与辅音',vi:'元音和辅音的区别',short:'元音与辅音',
theory:`
<h4>定义</h4>
<ul><li><b>元音</b>：发音时声带振动，气流通过口腔或鼻腔时<b>不受</b>发音器官任何部位的阻碍而形成的音。如 a、i、u。</li>
<li><b>辅音</b>：发音时气流通过口腔或鼻腔时<b>受到</b>发音器官不同部位的阻碍而形成的音。如 b、p、z、g。</li></ul>
<h4>元音和辅音的差别</h4>
${T(['方面','元音','辅音'],[
['气流','没有受阻碍','受阻碍'],
['发音器官','各部位保持均衡紧张','只是成阻部位紧张'],
['气流强弱','较弱','较强'],
['声带','要振动','有的振动（浊），有的不振动（清）'],
['响亮度','较响亮','一般不响亮']])}
<h4>其他相关知识</h4>
<ul><li><b>音素</b>：从自然话语中切分出来的最小语音单位（从生理和物理角度分类）。<b>音位</b>：能够区别意义的最小语音单位（从心理和意义角度分类）。音素是音位变体。</li>
<li><b>音节</b>是人们能够自然发出和感受到的最小语音单位。汉语音节 = 声母 + 韵母（韵头 + 韵腹 + 韵尾）+ 声调。</li>
<li>汉语音节<b>不能没有声调和韵腹</b>（主要元音）；可以没有辅音声母、韵头和韵尾。</li>
<li>辅音只在音节的开头或末尾出现；末尾的辅音只限于 <b>n 和 ng</b>；没有两个辅音相连的音节。</li>
<li><b>声母 ≠ 辅音</b>：声母是位置概念（音节开头），还有零声母；n 既可作声母又可作韵尾（男 nán）。</li></ul>
${T(['汉字','拼音','声母','韵头','韵腹','韵尾','声调'],[['表','biǎo','b','i','a','o','3'],['国','guó','g','u','o','—','2'],['安','ān','零','—','a','n','1']])}`,

<h4>用汉越音确定反切（课堂方法）</h4>
<ol><li><b>把切语译成汉越音</b>：上字 A、下字 B 都读汉越音。</li>
<li><b>C = A + B</b>：A 取<b>声母</b>，B 取<b>韵母和原来的声调</b>，拼出被切字 C。</li>
<li><b>确定 C 的声调</b>：看下面的模型——<b>"先横后竖"</b>：先看上字 A 的声调在哪一<b>行</b>（行决定阴阳），再看下字 B 的声调在哪一<b>列</b>（列决定平上去入）。</li>
<li><b>次浊例外</b>：上字 A 的汉越音声母是 <b>m、n、l、ng、nh、d、v</b>（次浊）时，平声被切字读 <b>thanh ngang</b>（不读 huyền）。例：奴冬 → nông，力中 → long，莫袍 → mao。</li>
<li>得到汉越音后，<b>转换成相应的汉字</b>。</li></ol>
<div class="key" style="max-width:none">模型：上行 <b>\\ 　~ 　.</b>（huyền、ngã、nặng，浊/阳）；下行 <b>o 　? 　/</b>（ngang、hỏi、sắc，清/阴）。三列分别是 平 / 上 / 去（入声同去声一列，但韵尾是 -p -t -c -ch）。</div>
${TONEBOX}
<p>例：苏弄 → tô（ngang，下行）+ lộng（nặng，第三列）→ 下行第三列 = sắc → <b>tống 送</b>。房六 → phòng（huyền，上行）+ lục（第三列）→ nặng → <b>phục 伏</b>。度官 → độ（上行）+ quan（第一列）→ huyền → <b>đoàn 团</b>。知演 → tri（下行）+ diễn（第二列）→ hỏi → <b>triển 展</b>。</p>
<p><b>注意：</b>越南语中 thanh ngã 常变为 thanh nặng（tĩnh → tịnh，cưỡng → gượng，nhẫn → nhịn），所以全浊上声字的汉越音多读 nặng：动 động、户 hộ、父 phụ、是 thị、下 hạ、道 đạo、后 hậu、近 cận、善 thiện。少数字汉越音另有习惯读法：谏 gián、山 sơn、充 sung、谴 khiển、江 giang、家 gia。</p>`;

<h4>《广韵》的例子</h4>
<p>唐韵 ${I('ɑŋ')} / ${I('uɑŋ')}（平）· 荡韵（上）· 宕韵（去）：唐、荡、宕是三个<b>韵目</b>，属同一个<b>韵部</b>。在隋唐时期 ɑ 和 a 区别意义，唐、荡、宕三韵韵腹读 ɑ。幽 iəu（平）· 黝 iəu（上）· 幼 iəu（去）：韵母相同，是三个韵目。</p>

/* ===== 新：音韵学概说 · 《广韵》 · 等韵图 ===== */
const GY={zh:'音韵学概说 · 《广韵》 · 等韵图',vi:'分支学科、《广韵》的体例、等韵图',short:'《广韵》与等韵图',
theory:`
<h4>音韵学的分支学科</h4>
${T(['学科','研究对象'],[['<b>古音学</b>','周秦两汉的汉语语音，即上古音。材料：先秦两汉的诗歌韵文、《诗经》用韵、形声字。'],['<b>今音学（广韵学）</b>','隋唐时代的汉语语音，即中古音。以《切韵》系韵书为对象。'],['<b>近音学</b>','元明时期的汉语语音，即近代音。以元代《中原音韵》系统的韵书和分析近代语音的等韵图为对象。'],['<b>等韵学</b>','等韵的理论和概念、韵图的制作和源流；研究等韵图、韵书中的反切。']])}
<h4>《广韵》</h4>
<ul><li>全称《<b>大宋重修广韵</b>》，北宋真宗大中祥符元年（1008）在《切韵》《唐韵》基础上增订而成。"广"是扩大、扩充的意思。</li>
<li>《切韵》：隋文帝仁寿元年（601），<b>陆法言</b>编撰，原则"论南北是非，古今通塞"，收字 12150 个，<b>193 韵</b>。《唐韵》：唐代孙愐增补。</li>
<li>《广韵》收字 26194 个，<b>206 韵</b>；语音系统与《切韵》相同，以隋唐时期洛阳音为基础，少量吸收南北方音和古音成分。《广韵》比《切韵》韵多，是因为把一些开合同韵分开（歌 / 戈、真 / 谆、寒 / 桓），又补了俨、酽等韵。</li>
<li><b>分卷</b>：以四声为纲，分五卷——上平声（28 韵）、下平声（29 韵）、上声（55 韵）、去声（60 韵）、入声（34 韵）。层次：<b>卷 → 韵 → 小韵</b>。</li>
<li><b>小韵</b>：一个小韵就是一个音节（同音字组），《广韵》有 3830 多个小韵。小韵之间或<b>声母不同</b>（东 德红切、通 他红切、同 徒红切、蒙 莫红切），或<b>韵头不同</b>（蒙 莫红切 muŋ 一等、瞢 莫中切 miuŋ 三等）。</li>
<li><b>又音</b>：一个字的另一种读法，用"又某某切"标出。</li>
<li><b>四声相配</b>：韵母相同、仅声调不同的韵相配（唐 荡 宕 铎）。<b>入声韵只与阳声韵相配</b>，不与阴声韵相配（韵尾 -p -t -k 与 -m -n -ŋ 相近）。不能根据序号或韵目今音来配。</li>
<li><b>独用与同用</b>："独用"的韵只能单独使用（东韵独用：杜甫《客亭》风 中 翁 蓬）；"同用"的韵可以合并使用（冬、钟同用：卢纶诗"龙 逢 松 重 宗"）。</li></ul>
<h4>等韵图</h4>
<ul><li>等韵图是古代等韵学家制定的一种<b>声、韵、调配合表</b>，最初用来分析韵书中的反切。</li>
<li>三种类型：① 分析《切韵》《广韵》音系的：《<b>韵镜</b>》《<b>七音略</b>》，把 206 韵绘成 <b>43 图（43 转）</b>；② 据当时语音调整的：《切韵指掌图》（20 图）、《四声等子》《经史正音切韵指南》（16 摄）；③ 完全打破《广韵》体系的：邵雍《皇极经世·声音倡和图》（北宋汴洛方音）、徐孝《重订司马温公等韵图经》（明代北京音）。</li>
<li>《韵镜》识读：横列为声母（唇、舌、牙、齿、喉、半舌、半齿，并分清浊），纵向分平上去入四声，每声分一、二、三、四等，图首标"开""合"。</li>
<li>"转"：声母和韵母辗转相拼。有二等韵的摄叫<b>外转</b>，没有二等韵的叫<b>内转</b>。</li></ul>`,

{f:`《广韵》全称《[[大宋重修广韵|大宋重修廣韻]]》，成书于公元 [[1008]] 年。`},
{f:`《切韵》成书于公元 [[601]] 年，作者是[[陆法言|陸法言]]。`},
{f:`《切韵》有 [[193]] 韵，《广韵》有 [[206]] 韵。`},
{f:`《广韵》的层次是：卷 → [[韵]] → [[小韵]]。`},
{f:`《韵镜》《七音略》把《广韵》206 韵绘成 [[43]] 图。`},

const S=[GY,B[9],B[0],B[1],B[2],B[3],YUN,B[4],B[6],B[5],B[7],B[8]];

/* ---------- normalize ---------- */
const T2S={};
('聲声韻韵濁浊氣气齒齿脣唇頭头陰阴陽阳變变類类轉转開开細细調调幫帮並并徹彻從从牀床審审禪禅見见曉晓來来攝摄邊边後后齊齐聯联係系遞递條条陳陈錄录廣广東东紅红鍾钟魚鱼蕭萧號号嘯啸篠筱刪删鹽盐銜衔嚴严學学國国發发奮奋雙双紐纽讀读終终蟲虫風风農农諫谏團团慣惯歡欢寬宽顯显譴谴蕩荡鐸铎藥药趙赵漢汉梵梵與与無无').replace(/(.)(.)/g,(m,a,b)=>{T2S[a]=b;return ''});
const TONES=/[\u0300\u0301\u0303\u0309\u0323]/g;
function vtone(x){const d=x.normalize('NFD');const t=(d.match(TONES)||[]).join('');return d.replace(TONES,'').normalize('NFC')+t}
function norm(s){return [...vtone(String(s).trim().toLowerCase()).replace(/\s+/g,'').replace(/[‘'ʻ]/g,'ʰ')].map(c=>T2S[c]||c).join('').replace(/^\[|\]$/g,'').replace(/母$/,'')}

/* ---------- render ---------- */
let uid=0;
function parse(html){
  html=html.replace(/\[\[(.+?)\]\]/g,(m,a)=>{const alts=a.split('|');const w=Math.max(...alts.map(x=>[...x].reduce((n,c)=>n+(c.charCodeAt(0)>0x2e80?1.6:0.85),0)));return `<input class="blank" id="b${++uid}" data-a="${a}" style="--w:${Math.min(Math.max(w,1.4),10).toFixed(1)}" autocomplete="off" spellcheck="false" aria-label="填空">`});
  html=html.replace(/\{\{(.+?)\}\}/g,(m,a)=>{const [opts,ans]=a.split('=');const list=opts.split('|');return `<select class="pick" id="s${++uid}" data-a="${ans}" aria-label="选择答案">${list.map((o,i)=>`<option value="${i===0?'':o}">${o}</option>`).join('')}</select>`});
  return html;
}
const progress={};
function renderPart(p,idx){
  const L='ABCD';
  const quiz=p.quiz.map(q=>q.f?`<li class="fill"><p><span class="tag">填空</span>${q.f}</p></li>`:
    `<li class="mcq" data-a="${q.a}"><div><p><span class="tag">选择</span>${q.q}</p><div class="opts">${q.o.map((o,i)=>`<button type="button" data-i="${i}">${L[i]}. ${o}</button>`).join('')}</div>${q.e?`<p class="exp" hidden>${q.e}</p>`:''}</div></li>`).join('');
  const ex=p.ex.map((e,i)=>`<article class="exer chk"><h4><span>练习 ${i+1}</span> ${e.t}</h4>${e.d?`<p class="d">${e.d}</p>`:''}<div>${e.h}</div>${e.s?`<div class="sol" hidden>${e.s}</div>`:''}<div class="actions"><button class="btn" data-act="check">检查</button><button class="btn ghost" data-act="show">查看答案</button><button class="btn ghost" data-act="reset">重做</button><span class="result"></span></div></article>`).join('');
  const prev=idx>0?`<a href="#p${idx}">← ${idx}. ${S[idx-1].short}</a>`:'<span></span>';
  const next=idx<S.length-1?`<a href="#p${idx+2}">${idx+2}. ${S[idx+1].short} →</a>`:'<span></span>';
  return parse(`<section class="part" id="p${idx+1}" hidden>
  <header class="part-head"><span class="no">${idx+1}</span><div><h2>${p.zh}</h2><p>${p.vi}</p></div></header>
  <details class="block theory" open><summary>理论要点（点击收起 / 展开）</summary>${p.theory}</details>
  <div class="block quiz chk"><h3>理论练习 · 填空与选择</h3><ol class="qlist">${quiz}</ol>
    <div class="actions"><button class="btn" data-act="check">检查</button><button class="btn ghost" data-act="show">查看答案</button><button class="btn ghost" data-act="reset">重做</button><span class="result"></span></div></div>
  <div class="block"><h3>练习</h3>${ex}</div>
  <div class="pager">${prev}${next}</div>
  </section>`);
}
const main=document.getElementById('main'), rail=document.getElementById('rail');
main.innerHTML=S.map(renderPart).join('');
rail.innerHTML=S.map((p,i)=>`<a href="#p${i+1}" data-p="${i+1}"><span class="n">${i+1}</span><span class="t"><b>${p.short}</b><span>${p.vi}</span></span><span class="sc" id="sc${i+1}"></span></a>`).join('');

function items(box){return [...box.querySelectorAll('input.blank,select.pick,.mcq')]}
function isRight(el){
  if(el.matches('.mcq')) return el.dataset.picked===el.dataset.a;
  if(el.matches('select')) return el.value===el.dataset.a;
  const v=norm(el.value); return v!=='' && el.dataset.a.split('|').some(a=>norm(a)===v);
}
function clearMarks(el){el.classList.remove('ok-f','bad-f','shown-f')}
function check(box){
  let c=0,t=0;
  items(box).forEach(el=>{t++;const r=isRight(el);if(r)c++;
    if(el.matches('.mcq')) markMcq(el,true); else {clearMarks(el);el.classList.add(r?'ok-f':'bad-f')}});
  box.querySelector(':scope > .actions .result, :scope .actions .result').textContent=`正确 ${c}/${t}`;
  const part=box.closest('.part'); progress[part.id]=progress[part.id]||{}; const k=[...part.querySelectorAll('.chk')].indexOf(box); progress[part.id][k]=c; updateScore(part);
}
function show(box){
  items(box).forEach(el=>{
    if(el.matches('.mcq')){markMcq(el,true,true)}
    else if(el.matches('select')){ if(el.value!==el.dataset.a){el.value=el.dataset.a;clearMarks(el);el.classList.add('shown-f')} else {clearMarks(el);el.classList.add('ok-f')} }
    else { if(!isRight(el)){el.value=el.dataset.a.split('|')[0];clearMarks(el);el.classList.add('shown-f')} else {clearMarks(el);el.classList.add('ok-f')} }
  });
  box.querySelectorAll('.sol').forEach(s=>s.hidden=false);
}
function reset(box){
  items(box).forEach(el=>{ if(el.matches('.mcq')){delete el.dataset.picked;el.querySelectorAll('button').forEach(b=>b.classList.remove('ok','bad'));const e=el.querySelector('.exp');if(e)e.hidden=true} else {el.value='';clearMarks(el)} });
  box.querySelectorAll('.sol').forEach(s=>s.hidden=true);
  box.querySelector('.result').textContent='';
}
function markMcq(li,final,reveal){
  const a=+li.dataset.a, p=li.dataset.picked;
  li.querySelectorAll('button').forEach(b=>{b.classList.remove('ok','bad');const i=+b.dataset.i;
    if(i===a && (p!==undefined||reveal)) b.classList.add('ok');
    if(p!==undefined && +p===i && i!==a) b.classList.add('bad');});
  const e=li.querySelector('.exp'); if(e && (p!==undefined||reveal)) e.hidden=false;
}
function totalOf(part){return items(part).length}
function updateScore(part){
  const c=Object.values(progress[part.id]||{}).reduce((a,b)=>a+b,0), t=totalOf(part);
  const el=document.getElementById('sc'+part.id.slice(1)); el.textContent=`${c}/${t}`; el.classList.toggle('full',c===t);
  try{localStorage.setItem('yyx-v3-progress',JSON.stringify(progress))}catch(e){}
  let C=0,TT=0;document.querySelectorAll('.part').forEach(q=>{C+=Object.values(progress[q.id]||{}).reduce((a,b)=>a+b,0);TT+=totalOf(q)});const tt=document.getElementById('total');if(tt)tt.textContent=`总得分 ${C} / ${TT}`;
}
main.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b) return;
  const li=b.closest('.mcq');
  if(li && b.dataset.i!==undefined){li.dataset.picked=b.dataset.i;markMcq(li);return}
  const box=b.closest('.chk'); if(!box) return;
  ({check,show,reset})[b.dataset.act]?.(box);
});
main.addEventListener('keydown',e=>{ if(e.key==='Enter' && e.target.matches('input.blank')){const box=e.target.closest('.chk'); check(box)} });

function go(){
  let n=parseInt((location.hash.match(/^#p(\d+)$/)||[])[1]);
  if(!n||n<1||n>S.length){ try{n=+localStorage.getItem('yyx-v3-part')||1}catch(e){n=1} }
  document.querySelectorAll('.part').forEach(s=>s.hidden=s.id!=='p'+n);
  rail.querySelectorAll('a').forEach(a=>a.setAttribute('aria-current',a.dataset.p==n?'true':'false'));
  try{localStorage.setItem('avh-zh-part',n)}catch(e){}
}
window.addEventListener('hashchange',()=>{go();window.scrollTo({top:0})});
try{const saved=JSON.parse(localStorage.getItem('avh-zh-progress')||'{}');Object.assign(progress,saved)}catch(e){}
document.querySelectorAll('.part').forEach(updateScore);
go();
</script>
</body></html>
